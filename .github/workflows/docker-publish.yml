name: Publish Docker Hub Images

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & Push Multi-Platform Images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Note: Set up Buildx for Docker image building.
      # linux/arm64 support can be added later using docker/setup-qemu-action.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sovereign-backend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sovereign-backend:latest

      - name: Build and Push UI Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sovereign-ui:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sovereign-ui:latest
