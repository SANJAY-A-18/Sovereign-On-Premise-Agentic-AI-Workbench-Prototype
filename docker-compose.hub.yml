# ==============================================================================
# Sovereign On-Premise Agentic AI Workbench - Docker Hub Compose Specification
# Architecture:
#   - Pulls pre-built multi-platform images from Docker Hub (${DOCKERHUB_USERNAME})
#   - Bundled containerized Ollama service with persistent model cache volume
#   - One-shot 'ollama-init' service automatically preloads required models:
#       * qwen2.5:3b (chat / reasoning)
#       * nomic-embed-text (local vector embeddings)
#   - FastAPI backend container communicates with Ollama via internal DNS (http://ollama:11434)
#   - Streamlit UI container communicates with backend via http://backend:8000
#   - Host port bindings restricted strictly to 127.0.0.1 (zero LAN exposure)
#   - Named volumes persist SQLite databases, vector stores, and model weights
# ==============================================================================

version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sovereign-ollama
    restart: unless-stopped
    ports:
      # Bound strictly to localhost (127.0.0.1) for sovereign security
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ollama-init:
    image: ollama/ollama:latest
    container_name: sovereign-ollama-init
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull qwen2.5:3b && ollama pull nomic-embed-text"

  backend:
    image: ${DOCKERHUB_USERNAME}/sovereign-backend:${TAG:-latest}
    container_name: sovereign-backend
    restart: unless-stopped
    ports:
      # Bound strictly to localhost (127.0.0.1) for sovereign security
      - "127.0.0.1:8000:8000"
    environment:
      # Containerized Ollama runtime resolution within Docker network
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}

      # Authentication - JWT_SECRET_KEY is strictly REQUIRED (no default, fails if unset)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required. Please set one in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # Storage & Database paths inside container volume mount (/app/data)
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/sovereign.db
      DEMO_DATABASE_URL: sqlite:////app/data/demo.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads

      # Zero cloud egress & telemetry suppression
      ANONYMIZED_TELEMETRY: "false"
      CHROMA_TELEMETRY: "false"

      # Agent Loop Configuration
      ENABLE_RETRY: ${ENABLE_RETRY:-true}
      MAX_AGENT_ITERATIONS: ${MAX_AGENT_ITERATIONS:-5}
      OLLAMA_JSON_MODE: ${OLLAMA_JSON_MODE:-true}
      PROMPT_VARIANT: ${PROMPT_VARIANT:-hardened}
      REQUIRE_RETRIEVAL_BEFORE_ABSTAIN: ${REQUIRE_RETRIEVAL_BEFORE_ABSTAIN:-false}

      # RAG Chunker Configuration
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      RAG_TOP_K: ${RAG_TOP_K:-3}
    volumes:
      - sovereign_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ui:
    image: ${DOCKERHUB_USERNAME}/sovereign-ui:${TAG:-latest}
    container_name: sovereign-ui
    restart: unless-stopped
    ports:
      # Bound strictly to localhost (127.0.0.1) for sovereign security
      - "127.0.0.1:8501:8501"
    environment:
      # Connects directly to backend service within internal docker network
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Persistent volume for SQLite database, Chroma vector index, and uploads
  sovereign_data:
    name: sovereign_data
  # Persistent volume for Ollama model weights (qwen2.5:3b and nomic-embed-text)
  ollama_data:
    name: sovereign_ollama_data
