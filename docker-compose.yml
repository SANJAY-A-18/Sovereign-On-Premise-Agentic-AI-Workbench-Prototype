# ==============================================================================
# Sovereign On-Premise Agentic AI Workbench - Docker Compose Specification
# Architecture:
#   - Native Ollama runs on host (http://localhost:11434)
#   - FastAPI backend container connects to host Ollama via host.docker.internal:11434
#   - Streamlit UI container connects to backend container via http://backend:8000
#   - Host port bindings restricted strictly to 127.0.0.1 (zero LAN exposure)
#   - Named volume 'sovereign_data' persists SQLite databases & Chroma vector store
# ==============================================================================

version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sovereign-backend:latest
    container_name: sovereign-backend
    restart: unless-stopped
    ports:
      # Bound strictly to localhost (127.0.0.1) for sovereign security
      - "127.0.0.1:8000:8000"
    environment:
      # Host Ollama runtime resolution (host.docker.internal)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}

      # Authentication - JWT_SECRET_KEY is strictly REQUIRED (compose fails if unset)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required. Please run 'python scripts/gen_secret.py --write' to set one in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # Storage & Database paths inside container volume mount (/app/data)
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/sovereign.db
      DEMO_DATABASE_URL: sqlite:////app/data/demo.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads

      # Zero cloud egress & telemetry suppression
      ANONYMIZED_TELEMETRY: "false"
      CHROMA_TELEMETRY: "false"

      # Agent Loop Configuration
      ENABLE_RETRY: ${ENABLE_RETRY:-true}
      MAX_AGENT_ITERATIONS: ${MAX_AGENT_ITERATIONS:-5}
      OLLAMA_JSON_MODE: ${OLLAMA_JSON_MODE:-true}
      PROMPT_VARIANT: ${PROMPT_VARIANT:-hardened}
      REQUIRE_RETRIEVAL_BEFORE_ABSTAIN: ${REQUIRE_RETRIEVAL_BEFORE_ABSTAIN:-false}

      # RAG Chunker Configuration
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      RAG_TOP_K: ${RAG_TOP_K:-3}
    extra_hosts:
      # Enables host resolution for Linux Docker engines as well as Windows/macOS
      - "host.docker.internal:host-gateway"
    volumes:
      - sovereign_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: sovereign-ui:latest
    container_name: sovereign-ui
    restart: unless-stopped
    ports:
      # Bound strictly to localhost (127.0.0.1) for sovereign security
      - "127.0.0.1:8501:8501"
    environment:
      # Connects directly to backend service within internal docker network
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Named volume for persistent SQLite databases and Chroma vector index
  sovereign_data:
    name: sovereign_data
